<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Reaction Optimizer Configuration</title>
</head>

<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">Reaction Optimizer Configuration and Generate Reaction scope</h1>

        <div class="d-grid gap-2 col-6 mx-auto mb-4">
            <button class="btn btn-secondary w-100" onclick="loadConfig()">Load old Config</button>
        </div>

        <div class="card shadow-sm mb-4 col-8 mx-auto" >
            <div class="card-body">
                <h2>Continuous Features</h2>
                <div id="continuousFeatures"></div>
                <button class="btn btn-primary mt-2" onclick="addContinuousFeature()">Add Continuous Feature</button>
            </div>
        </div>

        <div class="card shadow-sm mb-4 col-8 mx-auto">
            <div class="card-body">
                <h2>Categorical Features</h2>
                <div id="categoricalFeatures"></div>
                <button class="btn btn-primary mt-2" onclick="addCategoricalFeature()">Add Categorical Feature</button>
            </div>
        </div>

        <div class="card shadow-sm mb-4 col-8 mx-auto">
            <div class="card-body">
                <h2>Objectives</h2>
                <div id="objectives"></div>
                <button class="btn btn-primary mt-2" onclick="addObjective()">Add Objective</button>
            </div>
        </div>

        <div class="card shadow-sm mb-4 col-8 mx-auto">
            <div class="card-body">
                <h2>Other Settings</h2>
                <div class="mb-2">
                    <label for="sampling" class="form-label">Sampling Method:</label>
                    <select id="sampling" class="form-select">
                        <option value="random">Random</option>
                        <option value="lhs">Latin Hypercube</option>
                        <option value="sobol">Sobol Sequnce</option>
                    </select>
                </div>

                <div class="mb-2">
                    <label for="trainingSize" class="form-label">Training Size:</label>
                    <input type="number" id="trainingSize" class="form-control" value="10">
                </div>

                <div class="mb-2">
                    <label for="regressorModel" class="form-label">Regressor Model:</label>
                    <select id="regressorModel" class="form-select">
                        <option value="gb">Gradient Boosting</option>
                        <option value="rf">Random Forest</option>
                    </select>
                </div>

                <div class="mb-2">
                    <label for="fileName" class="form-label">File Name:</label>
                    <input type="text" id="fileName" class="form-control" value="reaction_data.csv">
                </div>

                <div class="mb-2">
                    <label for="batchSize" class="form-label">Batch Size:</label>
                    <input type="number" id="batchSize" class="form-control" value="1">
                </div>

                <div class="mb-2">
                    <label for="expDir" class="form-label">Experiment Directory:</label>
                    <input type="text" id="expDir" class="form-control" value="default_exp_dir"><br>
                </div>
                <!-- <label for="expDir">Experiment Directory:</label>
    <button id="expDirButton">Choose Folder</button>
    <span id="selectedFolder"></span><br> -->
            </div>
        </div>
        <div class="d-grid gap-2 col-6 mx-auto">
        <button class="btn btn-success w-100" onclick="submitConfig()">Generate Reaction Space</button>
        </div>
        <br>
        <br>
    </div>

    <script src="{{ url_for('static', filename='js/reaction_scope.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
