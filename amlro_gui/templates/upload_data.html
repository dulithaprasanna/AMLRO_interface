<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Old Data</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4">Upload Old Reaction Data</h1>
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="old_data" class="form-label">Select Old Data File</label>
                <input type="file" class="form-control" id="old_data" name="old_data" required>
            </div>
            <div class="mb-3">
                <label for="new_file_name" class="form-label">New File Name</label>
                <input type="text" class="form-control" id="new_file_name" name="new_file_name" value="reaction_data.csv">
            </div>
            <div class="mb-3">
                <label for="new_file_name" class="form-label">New Experiment Directory</label>
                <input type="text" class="form-control" id="new_exp_dir" name="new_exp_dir" value="default_exp_dir">
            </div>
            <button type="submit" class="btn btn-primary">Upload and Verify</button>
        </form>
    </div>
</body>

</html>
