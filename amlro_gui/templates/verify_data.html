<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Dataset</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4">Verify Uploaded Dataset</h1>
        <div class="mb-3">
            <h5>Uploaded Dataset:</h5>
            <div class="table-responsive">
                {{ df|safe }}
            </div>
        </div>
        <div class="mt-3">
            <button class="btn btn-success" onclick="verifyAndContinue()">Verify and Continue</button>
            <button class="btn btn-secondary" onclick="goBackToUpload()">Back to Upload</button>
        </div>
    </div>
</body>

<script>
    
    async function verifyAndContinue() {
        try {
            const response = await fetch('/verify_data', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    save_data: true
                })
            });

            if (response.ok) {
                const result = await response.json();
                alert('Data verified and saved successfully!');
                window.location.href = '/amlro_dashboard'; 
            } else {
                alert('Failed to verify data. Please try again.');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred while processing your request.');
        }
    }

    function goBackToUpload() {
        window.location.href = '/upload_old_data';
    }
</script>

</html>
